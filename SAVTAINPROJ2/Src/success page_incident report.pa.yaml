Screens:
  success page_incident report:
    Properties:
      BackgroundImage: ='papers.co-ml07-mountain-blur-minimal-nature-34-iphone6-plus-wallpaper'
      Fill: =RGBA(255, 255, 255, 1)
      ImagePosition: =ImagePosition.Stretch
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - iconCircle2:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledFill: =RGBA(0, 120, 212, 1)
            Fill: =RGBA(45, 128, 40, 1)
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            X: =Parent.Width/2 - Self.Width/2
            Y: =(Parent.Height/2 - Self.Height/2) * .7
      - iconCheck2:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(225, 223, 221, 1)
            Fill: =RGBA(155, 209, 73, 0)
            FocusedBorderThickness: =0
            Height: =iconCircle2.Height
            Icon: =Icon.Check
            PaddingBottom: =Self.PaddingTop
            PaddingLeft: =Self.PaddingTop
            PaddingRight: =Self.PaddingTop
            PaddingTop: =24
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =iconCircle2.Width
            X: =Parent.Width/2 - Self.Width/2
            Y: =(Parent.Height/2 - Self.Height/2) * .7
      - LblSuccessMsg2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =iconCircle2.Height
            Size: =20
            Text: ="Thank You"
            Width: =Parent.Width * 0.75
            X: =50
            Y: =430
      - Icon1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =42
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate('home page')
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =31
            X: =40
            Y: =40
