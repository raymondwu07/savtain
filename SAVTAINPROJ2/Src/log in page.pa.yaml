Screens:
  log in page:
    Properties:
      BackgroundImage: ='papers.co-ml07-mountain-blur-minimal-nature-34-iphone6-plus-wallpaper'
      Fill: =RGBA(255, 255, 255, 1)
      ImagePosition: =ImagePosition.Stretch
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Set(showPassword,false)
    Children:
      - Image4:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =227
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            Image: ='ChatGPT Image 2026年5月12日 11_39_22'
            ImagePosition: =ImagePosition.Fill
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =308
            X: =38
            Y: =30
      - Text7:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(232, 216, 190, 1)
            Font: =Font.'Lato Black'
            Size: =35
            Text: ="S A V T A I N"
            Width: =223
            X: =81
            Y: =198
      - Text7_2:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(201, 184, 159, 1)
            Font: =Font.Arial
            Size: =20
            Text: ="Not a volunteer yet?"
            Width: =223
            X: =81
            Y: =271
      - Text7_3:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(174, 208, 221, 1)
            Font: =Font.Arial
            OnSelect: =Navigate('Volunteer Requirements Page')
            Size: =20
            Text: ="Join Us!"
            Width: =100
            X: =142
            Y: =297
      - Avatar1:
          Control: Avatar@1.0.40
          Properties:
            X: =160
            Y: =350
      - txtE-mail:
          Control: ModernTextInput@1.1.0
          Properties:
            Default: =
            Placeholder: ="E-mail:"
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =250
            X: =67
            Y: =442
      - txtPassword:
          Control: ModernTextInput@1.1.0
          Properties:
            OnChange: =
            Placeholder: ="Password"
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Type: |-
              =If(
                  showPassword,
                  TextInputType.SingleLine,
                  TextInputType.Password
              )
            Width: =250
            X: =67
            Y: =490
      - Button2:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(138, 90, 43, 1)
            Color: =RGBA(232, 216, 190, 1)
            Height: =40
            OnSelect: |-
              =If(
                  !IsBlank('txtE-mail'.Text) && !IsBlank(txtPassword.Text),
                  Navigate('home page'),
                  Notify("Please enter both email and password.", NotificationType.Error)
              )
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Text: ="Log In"
            Width: =150
            X: =117
            Y: =545
      - Icon3:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(138, 126, 106, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =25
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: |-
              =If(
                  showPassword,
                  Icon.View,
                  Icon.Hide
              )
            OnSelect: =Set(showPassword,!showPassword)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =25
            X: =275
            Y: =495
